name: SancaBrew
options:
  bundleIdPrefix: br.com.sancabrew
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  SancaBrew:
    type: application
    platform: iOS
    sources:
      - path: SancaBrew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.sancabrew.app
        INFOPLIST_FILE: SancaBrew/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  SancaBrewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SancaBrewTests
    dependencies:
      - target: SancaBrew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.sancabrew.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SancaBrew:
    build:
      targets:
        SancaBrew: all
        SancaBrewTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SancaBrewTests
